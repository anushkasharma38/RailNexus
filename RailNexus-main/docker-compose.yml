services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: railnexus
      POSTGRES_USER: railnexus
      POSTGRES_PASSWORD: railnexus_demo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railnexus"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"

  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: local-docker-development-secret
      POSTGRES_DB: railnexus
      POSTGRES_USER: railnexus
      POSTGRES_PASSWORD: railnexus_demo
      POSTGRES_HOST: db
      CORS_ALLOWED_ORIGINS: http://localhost:5174
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8001/api
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "5174:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
